<!--
  scene-id: <what this scene shows and which object it hands to the next scene> (script scene [scene-id]).
  Copy to compositions/<id>.html, replace every "scene-id", and add its host to index.html at @scenes (any
  data-start/data-duration: scaffold.mjs --sync sets them from the timing, START to END below); replace SCENE with the
  script scene id ([hook]). Build every word and object with window.Design (type scale, grid, icons, step flows, phone
  and ui for app screens): never set a font size by hand.
-->
<template>
  <style>
    @font-face { font-family: "Reel Sans"; font-weight: 800; src: url("assets/fonts/reel-sans.ttf"); }
    @font-face { font-family: "Reel Mono"; font-weight: 700; src: url("assets/fonts/reel-mono.ttf"); }
    @font-face { font-family: "Reel Sans"; font-weight: 400; src: url("assets/fonts/reel-sans-400.ttf"); }
    @font-face { font-family: "Reel Mono"; font-weight: 400; src: url("assets/fonts/reel-mono-400.ttf"); }
    #root { position: absolute; inset: 0; overflow: hidden; font-family: "Reel Sans", sans-serif; font-weight: 800; }
    #scene-id-cam { position: absolute; inset: 0; }
    #root .ln { position: absolute; left: 0; right: 0; text-align: center; white-space: pre; line-height: 1; opacity: 0; }
  </style>
  <div id="root" data-composition-id="scene-id" data-width="{{W}}" data-height="{{H}}">
    <div id="scene-id-cam" data-layout-allow-overflow>
      <div id="scene-id-top"></div>
    </div>
  </div>
  <script>
    (function () {
      const K = window.ReelKit, U = window.Design, { F, prog, ease } = K;
      const sc = K.scene("SCENE"), NX = K.REEL.scenes[K.REEL.scenes.indexOf(sc) + 1];
      const START = F(sc.start), END = NX ? F(NX.start) + 10 : F(K.DUR);
      const BEAT = F(K.anchor("SCENE", "word"));
      const cam = document.getElementById("scene-id-cam"), top = document.getElementById("scene-id-top");
      const title = U.text(top, "scene-id-title", "TITLE", { kind: "title", cy: U.GRID.title });

      function render(t) {
        const f = START + Math.round(t * K.FPS);
        K.applyCam(cam, f / K.FPS);
        const a = prog(f, BEAT, 8, ease.expoOut), out = prog(f, END - 10, 10);
        U.pose(title, 0, 16 * (1 - a), 1, 0, a * (1 - out));
      }

      K.fonts(() => K.drive("scene-id", (END - START) / K.FPS, render));
    })();
  </script>
</template>
