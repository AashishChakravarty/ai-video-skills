<!doctype html>
<!--
  {{TITLE}}: version {{VERSION}} of a ai-video-skills reel, {{W}}x{{H}} ({{FORMAT}}), {{DUR}}s.
  Layers, back to front: bg (living dot field), Remotion clips with alpha inside .camwrap wrappers (camera
  applied here), the scene compositions, chrome (header, ticker, progress, follow CTA) and captions; one
  pre-mixed track (assets/mix.wav). Shared data: assets/reel-data.js (scaffold.mjs --sync rewrites it) and
  assets/direction.js (this version's camera, field reactions, ticker and CTA timing).
-->
<html lang="{{LANG}}" data-resolution="{{FORMAT}}" data-composition-variables='[{"id":"captions","type":"boolean","label":"Burned-in captions","default":true}]'>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{W}}, height={{H}}" />
    <script src="assets/gsap.min.js"></script>
    <script src="assets/reel-data.js"></script>
    <script src="assets/direction.js"></script>
    <script src="assets/reel-kit.js"></script>
    <script src="assets/design.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: {{W}}px; height: {{H}}px; overflow: hidden; background: {{BG}}; }
      #root { position: relative; width: 100%; height: 100%; }
      .camwrap { position: absolute; left: 0; top: 0; width: {{W}}px; height: {{H}}px; z-index: 2; }
      .camwrap video { position: absolute; left: 0; top: 0; width: {{W}}px; height: {{H}}px; object-fit: contain; }
      #bg { z-index: 1; }
      .scene { z-index: 3; }
      #chrome { z-index: 4; }
      #captions { z-index: 5; }
      html.no-captions #captions { display: none !important; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-full data-duration="{{DUR}}" data-width="{{W}}" data-height="{{H}}">
      <div id="bg" data-composition-id="bg" data-composition-src="compositions/bg.html" data-start="0" data-full data-duration="{{DUR}}" data-track-index="0" data-track-kind="graphics" data-width="{{W}}" data-height="{{H}}" data-motion-blur="off"></div>

      <!-- @clips: one <div class="camwrap" data-motion-blur="off"><video id="clip-<id>" class="clip" src="assets/clips/<id>.webm" data-start="<from/fps>" data-duration="<frames/fps>" data-layout-allow-occlusion muted playsinline></video></div> per Remotion clip -->

      <!-- @scenes: one <div id="<id>" class="scene" data-composition-id="<id>" data-composition-src="compositions/<id>.html" data-start=".." data-duration=".." data-track-kind="graphics" data-width="{{W}}" data-height="{{H}}"></div> per scene -->

      <div id="chrome" data-composition-id="chrome" data-composition-src="compositions/chrome.html" data-start="0" data-full data-duration="{{DUR}}" data-track-index="90" data-track-kind="graphics" data-width="{{W}}" data-height="{{H}}" data-motion-blur="off"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-full data-duration="{{DUR}}" data-track-index="91" data-track-kind="captions" data-width="{{W}}" data-height="{{H}}" data-motion-blur="off"></div>
      <audio id="mix" class="clip" src="assets/mix.wav" data-start="0" data-full data-duration="{{DUR}}" data-track-index="99" data-volume="1"></audio>
    </div>
    <script>
      (function () {
        const K = window.ReelKit;
        const vars = window.__hyperframes && window.__hyperframes.getVariables ? window.__hyperframes.getVariables() : {};
        if (vars.captions === false) document.documentElement.classList.add("no-captions");
        const wraps = [...document.querySelectorAll(".camwrap")];
        const tl = K.drive("main", K.DUR, (t) => {
          for (const w of wraps) K.applyCam(w, Math.round(t * K.FPS) / K.FPS);
        });
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
